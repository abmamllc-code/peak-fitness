<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>PEAK Fitness</title>
<meta name="description" content="PEAK Fitness — meals, gym and progress.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PEAK">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
/* Set theme before first paint so there is no flash */
(function(){try{var t=localStorage.getItem('peakfit.theme')||'dark';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='light'?'#ffffff':'#000000')}catch(e){}})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand" aria-label="PEAK Fitness">
      <img class="brand-mark" src="assets/icon-192.png" alt="" width="34" height="34">
      <span class="brand-name">PEAK</span>
      <span class="brand-sub">Fitness</span>
    </div>
    <button type="button" class="xp-chip" id="xpBar" aria-label="Level 1">
      <span class="xp-badge" id="xpLv">1</span>
      <span class="xp-mid"><span class="xp-label" id="xpLabel">Level 1</span><span class="xp-track"><i id="xpFill"></i></span></span>
      <span class="xp-next" id="xpNext">25 to 2</span>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="Switch theme">
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>

  <main class="views" id="views">
    <section class="view" id="view-meals" data-view="meals"></section>
    <section class="view" id="view-shop" data-view="shop" hidden></section>
    <section class="view" id="view-gym" data-view="gym" hidden></section>
    <section class="view" id="view-progress" data-view="progress" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <div class="tabs">
      <span class="tab-ind" id="tabInd"></span>
      <button class="tab is-active" data-tab="meals">
        <svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5M9 3v5M17 21V3c-2 1-3 3.5-3 7s1 4 3 4"/></svg><span>Food</span>
      </button>
      <button class="tab" data-tab="shop">
        <svg viewBox="0 0 24 24"><path d="M6 8h12l-1.2 12H7.2L6 8zM9 8V6.5A3 3 0 0 1 15 6.5V8"/></svg><span>Shop</span>
      </button>
      <button class="tab" data-tab="gym">
        <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>Gym</span>
      </button>
      <button class="tab" data-tab="progress">
        <svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 3 8-8M15 7h5v5"/></svg><span>Progress</span>
      </button>
    </div>
    <button class="mic" id="micBtn" aria-label="Voice update">
      <span class="mic-ring"></span>
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
    </button>
  </nav>

  <div class="restbar" id="restBar" role="timer" aria-label="Rest timer">
    <span class="rest-fill" id="restFill"></span>
    <div class="rest-main"><span class="rest-l">Rest</span><span class="rest-t" id="restTime">3:00</span><span class="rest-n" id="restName"></span></div>
    <button class="chip" data-rest="add">+30s</button>
    <button class="del" data-rest="skip" aria-label="Skip rest"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
</div>

<!-- Voice sheet -->
<div class="sheet-wrap" id="voiceSheet" aria-hidden="true">
  <div class="sheet-scrim" data-close></div>
  <div class="sheet" role="dialog" aria-label="Voice update">
    <div class="sheet-grip"></div>
    <div class="voice-state">
      <div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i></div>
      <p class="voice-status" id="voiceStatus">Listening…</p>
    </div>
    <form class="voice-form" id="voiceForm" autocomplete="off">
      <input class="field" id="voiceInput" placeholder="Say or type: tick off meal 1" enterkeyhint="go">
      <button class="pill pill-gold" type="submit">Apply</button>
    </form>
    <p class="voice-note" id="voiceNote"></p>
    <div class="voice-hints">
      <button class="chip" data-hint="tick off pre-gym">tick off pre-gym</button>
      <button class="chip" data-hint="lat pulldown 2 sets of 8 at 60 kilos">lat pulldown 2 sets of 8 at 60 kilos</button>
      <button class="chip" data-hint="tick off chicken thighs">tick off chicken thighs</button>
      <button class="chip" data-hint="add to shopping oats">add to shopping oats</button>
      <button class="chip" data-hint="bodyweight 82.5">bodyweight 82.5</button>
      <button class="chip" data-hint="waist 34">waist 34</button>
    </div>
  </div>
</div>

<div class="sheet-wrap" id="xpSheet" aria-hidden="true">
  <div class="sheet-scrim" data-xp-close></div>
  <div class="sheet xp-sheet" role="dialog" aria-modal="true" aria-label="Level progress">
    <div class="sheet-grip"></div>
    <div class="xp-sheet-body" id="xpBody"></div>
  </div>
</div>
<div class="lvl-up" id="lvlUp" hidden>
  <div class="lvl-card">
    <div class="lvl-kicker">Level up</div>
    <div class="lvl-num" id="lvlNum">2</div>
    <p>That one counts. Keep going.</p>
    <button type="button" class="pill pill-gold" id="lvlOk">Nice</button>
  </div>
</div>
<div class="eye-pop" id="eyePop" hidden>
  <div class="eye-scrim" data-eye-close></div>
  <div class="eye-card" id="eyeCard" role="dialog" aria-modal="true" aria-labelledby="eyeTitle"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
